<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Task'in</title>
<style>
  :root{
    --ocean:#2563EB; --ocean-deep:#1D4ED8; --ocean-dim:#DBEAFE; --border:#E2E8F0;
    --text:#0F172A; --text2:#64748B; --surface:#fff; --surface2:#F1F5F9; --green:#22C55E;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; width:300px; font-family:'Inter',system-ui,-apple-system,sans-serif;
    background:var(--surface); color:var(--text); -webkit-font-smoothing:antialiased;
  }
  .menu-header{
    background:var(--surface); color:var(--ocean); padding:12px 14px; border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:8px; font-weight:800; font-size:15px; letter-spacing:-.02em;
  }
  .menu-header img{width:22px;height:22px;border-radius:6px;}
  .menu-body{padding:8px;}
  .menu-item{
    display:flex; align-items:center; gap:10px; padding:10px 8px;
    border-radius:8px; cursor:pointer; font-size:12.5px; font-weight:600;
    transition: background .12s;
  }
  .menu-item:hover{background:var(--surface2);}
  .menu-icon svg{width:15px;height:15px;}
  .menu-icon{
    width:28px; height:28px; border-radius:8px; background:var(--ocean-dim); color:var(--ocean);
    display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0;
  }
  .menu-item.toggle-row{cursor:default;}
  .menu-item.toggle-row:hover{background:transparent;}
  .switch{
    position:relative; width:36px; height:20px; margin-left:auto; flex-shrink:0;
  }
  .switch input{opacity:0; width:0; height:0;}
  .slider{
    position:absolute; cursor:pointer; inset:0; background:#CBD5E1;
    border-radius:20px; transition:.15s;
  }
  .slider::before{
    content:""; position:absolute; width:16px; height:16px; left:2px; top:2px;
    background:#fff; border-radius:50%; transition:.15s;
  }
  .switch input:checked + .slider{background:var(--green);}
  .switch input:checked + .slider::before{transform:translateX(16px);}
  .menu-sub{font-size:9.5px; color:var(--text2); font-weight:400; margin-top:1px;}
  .menu-divider{height:1px; background:var(--border); margin:4px 8px;}
  /* Mon dispatch client (agent connecté) */
  .dispatch{margin:4px 0 6px; padding:10px; border:1px solid var(--border); border-radius:10px; background:var(--surface2);}
  .dispatch[hidden]{display:none;}
  .dispatch-title{display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:700;}
  .dispatch-state{font-size:10.5px; color:var(--text2); margin:3px 0 8px; line-height:1.35;}
  .dispatch-chips{display:flex; flex-wrap:wrap; gap:5px;}
  .dispatch-chip{
    border:1px solid var(--border); background:var(--surface); color:var(--text); border-radius:999px;
    padding:5px 9px; font-family:inherit; font-size:11px; font-weight:600; line-height:1.2; cursor:pointer;
  }
  .dispatch-chip:hover{border-color:var(--ocean);}
  .dispatch-chip.active{background:var(--ocean); border-color:var(--ocean); color:#fff;}
  .dispatch-chip.none.active{background:var(--text2); border-color:var(--text2);}
  .dispatch-chip:focus-visible,.dispatch-save:focus-visible{outline:2px solid var(--ocean); outline-offset:2px;}
  .dispatch-foot{display:flex; align-items:center; gap:8px; margin-top:8px;}
  .dispatch-hint{flex:1; font-size:10px; color:var(--text2); line-height:1.3;}
  .dispatch-save{
    margin-left:auto; border:0; border-radius:8px; background:var(--ocean); color:#fff;
    padding:7px 11px; font-family:inherit; font-size:11.5px; font-weight:700; line-height:1; cursor:pointer; white-space:nowrap;
  }
  .dispatch-save:disabled{opacity:.45; cursor:default;}
  .dispatch-msg{font-size:10.5px; margin-top:6px; color:var(--text2);}
  .dispatch-msg.error{color:#DC2626;}
  .dispatch-msg.ok{color:#15803D;}
</style>
</head>
<body>
  <div class="menu-header"><img src="icons/icon48.png" alt="">Task'in</div>
  <div class="menu-body">
    <section class="dispatch" id="dispatch" hidden aria-label="Mon dispatch client">
      <div class="dispatch-title"><div class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M3 12h12M3 18h7"/><circle cx="17" cy="17" r="3"/><path d="m21 21-1.8-1.8"/></svg></div>Mon dispatch client</div>
      <div class="dispatch-state" id="dispatch-state">Chargement…</div>
      <div class="dispatch-chips" id="dispatch-chips" role="group" aria-label="Canaux dispatchés"></div>
      <div class="dispatch-foot"><span class="dispatch-hint" id="dispatch-hint"></span><button type="button" class="dispatch-save" id="dispatch-save" disabled>Mettre à jour</button></div>
      <div class="dispatch-msg" id="dispatch-msg" role="status"></div>
    </section>
    <div class="menu-item" id="open-window">
      <div class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg></div>
      <div>Transférer le bouton ici<div class="menu-sub">Vers la fenêtre active</div></div>
    </div>
    <div class="menu-item" id="open-doc">
      <div class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg></div>
      <div>Documentation<div class="menu-sub">Procédures OnSpot</div></div>
    </div>
    <div class="menu-divider"></div>
    <div class="menu-item toggle-row">
      <div class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="4"/><circle cx="15.5" cy="15.5" r="2.5"/></svg></div>
      <div style="flex:1">Pop-up flottant<div class="menu-sub" id="toggle-status">Activé</div></div>
      <label class="switch">
        <input type="checkbox" id="float-toggle" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>
  <script src="supabase-client.js"></script>
  <script src="menu.js"></script>
</body>
</html>
