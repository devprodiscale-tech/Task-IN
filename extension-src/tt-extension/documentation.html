<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Task'in — Documentation</title>
<style>
  :root{
    --ocean:#2563EB; --ocean-deep:#1D4ED8; --ocean-dim:#DBEAFE; --border:#E2E8F0;
    --text:#0F172A; --text2:#64748B; --text3:#94A3B8;
    --surface:#fff; --surface2:#F1F5F9; --amber:#DCAE1D;
    --clay:#E98A7D; --bloom:#D4537E; --green:#3B8C6E;
  }
  *{box-sizing:border-box;}
  html,body{height:100%; margin:0; min-width:280px; min-height:340px;}
  body{
    font-family:'Inter',system-ui,-apple-system,sans-serif; color:var(--text); background:var(--surface);
    display:flex; flex-direction:column;
  }
  header{
    background:var(--surface); border-bottom:1px solid var(--border); box-shadow:0 5px 20px rgba(21,58,95,.04);
    color:var(--ocean); padding:12px 16px; display:flex; align-items:center; gap:10px; flex-shrink:0;
  }
  header img{width:24px;height:24px;border-radius:6px;}
  header .title{font-weight:800; font-size:15px; letter-spacing:-.02em;}
  header .sub{font-size:9.5px; font-weight:700; background:var(--ocean-dim); color:var(--ocean); padding:2px 8px; border-radius:20px; margin-left:auto;}

  button,input,select,textarea{font-family:inherit;}

  .search-bar{padding:10px 14px; border-bottom:1px solid var(--border); flex-shrink:0;}
  .search-bar input{
    width:100%; border:1px solid var(--border); border-radius:20px; padding:8px 14px;
    font-size:12.5px; font-family:inherit;
  }

  main{flex:1; overflow:hidden; display:flex; flex-direction:column;}
  .view{flex:1; overflow-y:auto; padding:8px 12px;}
  .hidden{display:none !important;}

  .doc-item{position:relative; display:flex; align-items:center; gap:10px; padding:9px 10px 9px 14px; border-radius:10px; cursor:pointer; margin-bottom:4px;}
  .doc-item:hover{background:var(--surface2);}
  .doc-item::before{content:""; position:absolute; left:0; top:6px; bottom:6px; width:4px; border-radius:0;}
  .doc-item-icon{width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0;}
  .doc-item-title{font-size:12.5px; font-weight:700; color:var(--text);}
  .doc-item-cat{font-size:9.5px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; margin-top:1px;}

  .doc-detail-header{margin:-8px -12px 12px; padding:18px 16px 20px; display:flex; align-items:center; gap:10px; color:#fff;}
  .back-btn{width:28px; height:28px; border-radius:7px; border:none; background:rgba(255,255,255,.22); color:#fff; cursor:pointer; font-size:16px; flex-shrink:0;}
  .doc-detail-icon{width:38px; height:38px; border-radius:10px; background:rgba(255,255,255,.25); display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0;}
  .doc-detail-title{font-weight:800; letter-spacing:-.02em; font-size:17px;}
  .doc-detail-cat{font-size:10px; font-weight:700; letter-spacing:.04em; opacity:.85;}

  .doc-block-text{font-size:12.5px; color:var(--text2); line-height:1.55; margin-bottom:10px;}
  .doc-block-text strong{color:var(--text);}
  .doc-block-list{font-size:12.5px; color:var(--text2); line-height:1.55; margin:0 0 10px 18px;}
  .doc-block-callout{font-size:12px; border-radius:10px; padding:10px 13px; margin-bottom:10px; border:1px solid transparent;}

  .doc-step{display:flex; align-items:flex-start; gap:10px; margin-bottom:10px;}
  .doc-step-num{width:22px; height:22px; border-radius:50%; color:#fff; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .doc-step-body{font-size:11.5px; color:var(--text2); line-height:1.5;}
  .doc-step-body b{color:var(--text);}

  .doc-urgent{border-radius:10px; padding:11px 13px; margin-bottom:10px; border:1px solid transparent;}
  .doc-urgent-tag{font-size:9.5px; font-weight:700; letter-spacing:.03em; margin-bottom:4px; display:inline-block;}
  .doc-urgent-title{font-size:12px; font-weight:700; color:var(--text); margin-bottom:3px;}
  .doc-urgent-body{font-size:11px; color:var(--text2); line-height:1.5;}

  .doc-empty{text-align:center; color:var(--text3); font-size:12px; padding:24px;}

</style>
</head>
<body>
  <header><img src="icons/icon32.png" alt=""><span class="title">Task'in</span><span class="sub">Documentation</span></header>

  <div class="search-bar"><input type="text" id="search-input" placeholder="Rechercher..."></div>

  <main>
    <div class="view" id="docs-view">
      <div id="docs-list"></div>
      <div id="docs-detail" class="hidden"></div>
    </div>
  </main>

  <script src="supabase-client.js"></script>
  <script src="documentation.js"></script>
</body>
</html>
